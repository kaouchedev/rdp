name: Windows 2022 + Tailscale + RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # RDP authentication settings
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Recreate firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force


      - name: Create kaouche RDP User
        shell: powershell
        run: |
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "kaouche" -ErrorAction SilentlyContinue)) {

              New-LocalUser `
                -Name "kaouche" `
                -Password $securePass `
                -AccountNeverExpires `
                -Description "RDP User"

          }

          # Add user to Administrators
          if (-not (Get-LocalGroupMember -Group "Administrators" -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -like "*\kaouche" })) {

              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member "kaouche"
          }

          # Add user to Remote Desktop Users
          if (-not (Get-LocalGroupMember -Group "Remote Desktop Users" -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -like "*\kaouche" })) {

              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member "kaouche"
          }

          if (-not (Get-LocalUser -Name "kaouche" -ErrorAction SilentlyContinue)) {
              Write-Error "User kaouche creation failed"
              exit 1
          }

          Write-Host "kaouche user created successfully."


      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

          Write-Host "Tailscale installed."


      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 12) {

              $tsIP = & $tailscale ip -4

              if (-not $tsIP) {
                  Write-Host "Waiting for Tailscale IP..."
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected."
          Write-Host "Tailscale IP: $tsIP"


      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Testing RDP..."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host "RDP port 3389 is accessible."


      - name: Download Script and Maintain RDP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "================================="
          Write-Host "        RDP ACCESS READY"
          Write-Host "================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: kaouche"
          Write-Host "================================="
          Write-Host ""

          $rdpProfile = "C:\Users\kaouche"

          $startupPath = `
            "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"

          $downloadUrl = `
            "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"

          $downloadPath = "$startupPath\Downloads.bat"

          # Wait until kaouche profile exists
          while ($true) {

              if (Test-Path $rdpProfile) {

                  try {

                      if (-not (Test-Path $startupPath)) {

                          New-Item `
                            -ItemType Directory `
                            -Path $startupPath `
                            -Force | Out-Null
                      }

                      Write-Host "Downloading Downloads.bat..."

                      Invoke-WebRequest `
                        -Uri $downloadUrl `
                        -OutFile $downloadPath `
                        -UseBasicParsing

                      Write-Host "Downloads.bat copied to:"
                      Write-Host $downloadPath

                      # Execute script
                      cmd /c "`"$downloadPath`""

                      Write-Host "Downloads.bat executed."

                      break
                  }
                  catch {

                      Write-Host "Error downloading/executing Downloads.bat:"
                      Write-Host $_.Exception.Message

                      break
                  }

              }
              else {

                  Write-Host "[$(Get-Date)] Waiting for kaouche profile..."

                  Start-Sleep -Seconds 30
              }
          }

          # Keep GitHub runner alive
          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active"
              Write-Host "Address : $env:TAILSCALE_IP"
              Write-Host "Username: kaouche"

              Start-Sleep -Seconds 300
          }
